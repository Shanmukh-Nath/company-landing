<svg width="500" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="edopsGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C94043" />
      <stop offset="100%" stop-color="#A92427" />
    </linearGradient>
  </defs>
  <g>
    <title>Edops ERP Logo</title>
    <!-- Stylized graduation cap & infinity loop symbol -->
    <path d="M 25,18 L 42,28 L 25,38 L 8,28 Z" fill="url(#edopsGlow)" />
    <path d="M 14,32 L 14,40 Q 25,46 36,40 L 36,32" fill="none" stroke="#C94043" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 32,30 L 44,42 L 44,48" fill="none" stroke="#A92427" stroke-width="1.8" stroke-linecap="round" />
    
    <path d="M 12,62 C 4,62 4,47 12,47 C 20,47 30,62 38,62 C 46,62 46,47 38,47 C 30,47 20,62 12,62 Z" fill="none" stroke="url(#edopsGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Main text -->
    <text x="60" y="72" font-family="system-ui, -apple-system, Arial, sans-serif" font-weight="900" font-size="80" fill="#f1f5f9" letter-spacing="-2" id="svg_logo_text">edops</text>
    
    <!-- Decorative lines beneath -->
    <rect x="68" y="95" width="85" height="4" fill="#A92427" />
    <rect x="161" y="95" width="70" height="4" fill="#C94043" />
    <rect x="239" y="95" width="55" height="4" fill="#FFA3A5" />
    
    <!-- ERP text at top right of edops -->
    <text x="365" y="30" font-family="system-ui, -apple-system, Arial, sans-serif" font-weight="700" font-size="16" fill="#94a3b8" letter-spacing="3">ERP</text>
  </g>
</svg>
